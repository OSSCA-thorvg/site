<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Apple Instruments</title>
  <desc id="desc">Vector presentation icon based on the Instruments performance gauge.</desc>
  <defs>
    <linearGradient id="bg" x1="8" y1="5" x2="56" y2="61" gradientUnits="userSpaceOnUse">
      <stop stop-color="#353A3C"/>
      <stop offset=".52" stop-color="#172326"/>
      <stop offset="1" stop-color="#0A1114"/>
    </linearGradient>
    <radialGradient id="dial" cx="0" cy="0" r="1" gradientTransform="translate(32 31) rotate(90) scale(28)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#163C45"/>
      <stop offset="1" stop-color="#0B1417" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="12" y1="18" x2="53" y2="43" gradientUnits="userSpaceOnUse">
      <stop stop-color="#75F5FF"/>
      <stop offset="1" stop-color="#06B9ED"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="tile">
      <rect x="2" y="2" width="60" height="60" rx="14"/>
    </clipPath>
    <line id="tick" x1="32" y1="9" x2="32" y2="13.5"/>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
    <rect x="2" y="2" width="60" height="60" fill="url(#dial)"/>
    <g fill="none" stroke="#19C9EF" stroke-width=".65" opacity=".22">
      <path d="M2 16h60M2 32h60M2 48h60M16 2v60M32 2v60M48 2v60"/>
      <circle cx="32" cy="34" r="15"/>
      <circle cx="32" cy="34" r="22"/>
    </g>
    <path d="M10 40A23.4 23.4 0 0 1 54 40" fill="none" stroke="url(#cyan)" stroke-width="1.7" stroke-linecap="round" filter="url(#glow)"/>
    <g fill="none" stroke="#69F1FF" stroke-width="1.4" stroke-linecap="round" filter="url(#glow)">
      <use href="#tick" transform="rotate(-72 32 34)"/>
      <use href="#tick" transform="rotate(-60 32 34)"/>
      <use href="#tick" transform="rotate(-48 32 34)"/>
      <use href="#tick" transform="rotate(-36 32 34)"/>
      <use href="#tick" transform="rotate(-24 32 34)"/>
      <use href="#tick" transform="rotate(-12 32 34)"/>
      <use href="#tick"/>
      <use href="#tick" transform="rotate(12 32 34)"/>
      <use href="#tick" transform="rotate(24 32 34)"/>
      <use href="#tick" transform="rotate(36 32 34)"/>
      <use href="#tick" transform="rotate(48 32 34)"/>
      <use href="#tick" transform="rotate(60 32 34)"/>
      <use href="#tick" transform="rotate(72 32 34)"/>
    </g>
    <path d="m32 34-13-13" fill="none" stroke="#76F3FF" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    <path d="m32 34-13-13" fill="none" stroke="#F8FFFF" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="32" cy="34" r="3" fill="#EFFFFF" stroke="#5CEAFF" stroke-width="1.2"/>
    <rect x="13" y="46" width="38" height="9" rx="4.5" fill="#0AAFEA" stroke="#76F5FF" stroke-width=".8" filter="url(#glow)"/>
    <path d="M18 50.5h3l2-2.2 3.1 4.1 3-3.2 3.1 2.3 3.1-1.5 3 1.5 3-2.4 2.4 1.4H46" fill="none" stroke="#F5FFFF" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#71787A" stroke-width="1"/>
</svg>
